name: ensure-poll

# Restart poll.yml when the self-chain has stopped. Hourly schedule is
# best-effort; while poll.yml is healthy this job only checks and exits.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke check refresh endpoint
        run: |
          echo "=== Testing curl from GitHub Actions ==="
          curl -i -s -X POST "${{ vars.REFRESH_URL }}/api/refresh?secret=${{ secrets.CRON_SECRET }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            --max-time 15 || true
          echo "=== End test ==="

      - name: Start poller if idle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow=poll.yml --limit 30 --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="requested" or .status=="pending")] | length')
          echo "active pollers: $active"
          if [ "$active" = "0" ]; then
            gh workflow run poll.yml --ref main
          fi
